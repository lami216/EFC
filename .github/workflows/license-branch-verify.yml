name: Verify license branch

on:
  push:
    branches: [certificate-filters-license-v8]

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Generate icons
        run: npm run icons
      - name: Build frontend
        run: npm run build
      - name: Check EFC Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Check activation generator
        run: cargo check --manifest-path tools/license-generator/Cargo.toml
