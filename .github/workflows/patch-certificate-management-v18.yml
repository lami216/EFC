name: Patch certificate management v18

on:
  push:
    branches:
      - feature/fiscal-year-current-v14
    paths:
      - '.github/workflows/patch-certificate-management-v18.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fiscal-year-current-v14
          fetch-depth: 4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply certificate management update
        run: python scripts/patch-certificate-management-v18.py

      - name: Install verification dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify certificate management update
        run: node scripts/verify-stop-cert-finance-v17.mjs

      - name: Verify production source
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Commit verified certificate management update
        shell: bash
        run: |
          git config user.name "lami216"
          git config user.email "iiyad21694@gmail.com"
          git add assets/production-certificates-v13.js scripts/verify-stop-cert-finance-v17.mjs scripts/*.mjs assets/production-license-gate-v8.js index.html
          git commit -m "feat: edit certificate receipts and make finance responsive"
          git push origin HEAD:feature/fiscal-year-current-v14
