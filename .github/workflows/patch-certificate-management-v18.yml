name: Patch certificate management v18

on:
  push:
    branches:
      - feature/fiscal-year-current-v14
    paths:
      - '.github/workflows/patch-certificate-management-v18.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/fiscal-year-current-v14
          fetch-depth: 4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply certificate receipt management and responsive finance update
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          cert_path=Path('assets/production-certificates-v13.js')
          cert=cert_path.read_text(encoding='utf-8')

          def once(text,old,new,label):
              count=text.count(old)
              if count!=1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old,new,1)

          def block(text,start,end,new,label):
              i=text.find(start)
              if i<0: raise SystemExit(f'{label}: start marker not found')
              j=text.find(end,i)
              if j<0: raise SystemExit(f'{label}: end marker not found')
              return text[:i]+new.rstrip()+"\n"+text[j:]

          cert=once(cert,
          "let branchSaveInFlight=false;\nlet saveChain=Promise.resolve();",
          "let branchSaveInFlight=false;\nlet editingReceiptId=null;\nlet receiptDeleteInFlight=false;\nlet saveChain=Promise.resolve();",
          'certificate mutation state')

          cert=once(cert,
