name: Align finance workspace with certificate layout

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/finance-align-certificate.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align finance workspace dimensions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('assets/production-finance-ui-v13.js')
          s=p.read_text(encoding='utf-8')
          reps={
            '.content:has(.finance-switch-v13){width:900px!important;max-width:900px!important;min-width:900px!important;margin:0 0 0 auto!important;padding:16px 0 18px!important;box-sizing:border-box!important;overflow:visible!important}':
            '.content:has(.finance-switch-v13){width:900px!important;max-width:900px!important;min-width:900px!important;margin:0 0 0 auto!important;margin-right:22px!important;padding:12px 0 12px!important;box-sizing:border-box!important;overflow:visible!important}',
            'const width=1120,height=230,left=82,right=26,top=18,bottom=38,values=':
            'const width=1120,height=205,left=82,right=26,top=15,bottom=34,values=',
            'margin:0 0 9px auto!important': 'margin:0 0 7px auto!important',
            'height:39px!important;min-width:112px!important': 'height:36px!important;min-width:112px!important',
            'margin:0 0 10px!important;padding:11px 12px!important': 'margin:0 0 8px!important;padding:8px 12px!important',
            'height:41px!important;min-width:0!important': 'height:38px!important;min-width:0!important',
            '#financeModeV13{height:41px!important': '#financeModeV13{height:38px!important',
            '#financeModeV13 button{height:31px!important': '#financeModeV13 button{height:28px!important',
            'gap:9px!important;margin:0 0 10px!important': 'gap:9px!important;margin:0 0 8px!important',
            'min-height:76px!important;margin:0!important;padding:12px 14px!important': 'min-height:68px!important;margin:0!important;padding:9px 14px!important',
            'margin:0 0 10px!important;padding:7px 10px 4px!important': 'margin:0 0 8px!important;padding:5px 10px 3px!important',
            'max-height:205px!important': 'max-height:174px!important',
            'gap:10px!important;margin:0!important': 'gap:10px!important;margin:0!important',
            'min-height:112px!important;margin:0!important;padding:11px 13px!important': 'min-height:96px!important;margin:0!important;padding:9px 13px!important',
            '@media(max-height:760px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.92!important}}\n@media(max-height:650px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.86!important}}':
            '@media(max-height:650px) and (min-width:1050px){.content:has(.finance-switch-v13){padding-top:8px!important;padding-bottom:8px!important}.finance-hero-v13{margin-bottom:8px!important}.content:has(.finance-switch-v13) #financeBodyV13>.chart-card{margin-bottom:6px!important}.content:has(.finance-switch-v13) .finance-chart-wrap-v13 svg{max-height:158px!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card{min-height:88px!important;padding-top:7px!important;padding-bottom:7px!important}}'
          }
          for old,new in reps.items():
              if old not in s:
                  raise SystemExit(f'Expected finance pattern not found: {old[:90]}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          v=Path('scripts/verify-critical-runtime.mjs')
          t=v.read_text(encoding='utf-8')
          if "requireText(financeUi,'height=230'" in t:
              t=t.replace("requireText(financeUi,'height=230','finance chart is compact enough for the fixed workspace');","requireText(financeUi,'height=205','finance chart is compact enough for the fixed workspace');")
          if "finance workspace keeps certificate-page sidebar spacing" not in t:
              anchor="requireText(financeUi,'#financeModeV13 button.active','finance period buttons have an explicit active visual state');"
              extra="\nrequireText(financeUi,'margin-right:22px!important','finance workspace keeps certificate-page sidebar spacing');\nforbidText(financeUi,'zoom:.92','finance page should not shrink the entire workspace on short screens');\nforbidText(financeUi,'zoom:.86','finance page should not shrink the entire workspace on short screens');"
              if anchor not in t: raise SystemExit('Verifier finance anchor not found')
              t=t.replace(anchor,anchor+extra,1)
          v.write_text(t,encoding='utf-8')

          for fn in ['index.html','assets/production-license-gate-v8.js']:
              q=Path(fn); d=q.read_text(encoding='utf-8')
              d=d.replace('20260912-finance-redesign-2','20260912-finance-redesign-3')
              q.write_text(d,encoding='utf-8')
          PY
      - name: Verify and build
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Align finance workspace with certificate dimensions"
          git push origin HEAD:redesign/efc-ui-2026
