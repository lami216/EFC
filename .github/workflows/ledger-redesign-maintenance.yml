name: Redesign daily ledger

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/ledger-redesign-maintenance.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply ledger redesign
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('assets/production-finance-ui-v13.js')
          s=p.read_text(encoding='utf-8')
          old="${pageTitle('الحركة اليومية','اليومية','اليوم المحدد فقط، وأحدث عملية في الأعلى.')}"
          new='''<section class="ledger-hero-v13"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g></svg><h1>اليومية</h1></section>'''
          if old not in s:
              raise SystemExit('ledger title token missing')
          s=s.replace(old,new,1)

          marker='window.EFC_FINANCE_UI_V13=Object.freeze('
          if marker not in s:
              raise SystemExit('finance export marker missing')
          if 'efc-ledger-redesign-v13' not in s:
              css=r'''
          const ledgerRedesignStyle=document.createElement('style');
          ledgerRedesignStyle.id='efc-ledger-redesign-v13';
          ledgerRedesignStyle.textContent=`
          .content:has(#ledgerBodyV13){width:900px!important;max-width:900px!important;min-width:900px!important;height:100dvh!important;margin:0 0 0 auto!important;margin-right:22px!important;padding:12px 0!important;box-sizing:border-box!important;overflow:hidden!important;font-family:"Segoe UI Variable","Segoe UI",Tahoma,Arial,sans-serif!important}
          .ledger-hero-v13{width:470px;height:76px;margin:0 auto 12px;border-radius:15px;background:linear-gradient(110deg,#dcf6ee 0%,#e8faf5 68%,#e4f7f2 100%);display:flex;align-items:center;justify-content:center;gap:20px;color:#073f35;box-shadow:0 9px 24px rgba(17,89,70,.045);position:relative}
          .ledger-hero-v13::after{content:"";position:absolute;bottom:10px;left:50%;width:48px;height:3px;border-radius:99px;background:#0b7b62;transform:translateX(-50%)}
          .ledger-hero-v13 svg{width:37px;height:37px;flex:0 0 37px}.ledger-hero-v13 h1{margin:0;font-size:31px;line-height:1;font-weight:850;letter-spacing:-.4px}
          .content:has(#ledgerBodyV13) .ledger-controls{width:900px!important;display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:10px!important;align-items:end!important;margin:0 0 9px!important;padding:10px 13px!important;border:1.4px solid #4aa68c!important;border-radius:13px!important;background:linear-gradient(180deg,#fbfffd,#f5fcf9)!important;box-shadow:0 8px 20px rgba(22,83,64,.035)!important;box-sizing:border-box!important}
          .content:has(#ledgerBodyV13) .ledger-controls label{gap:5px!important;font-size:9.5px!important;font-weight:800!important;color:#18483d!important}.content:has(#ledgerBodyV13) .ledger-controls .input,.content:has(#ledgerBodyV13) .ledger-controls select{height:42px!important;border:1px solid #cfddd8!important;border-radius:9px!important;background:#fff!important;padding:7px 11px!important;color:#162d27!important;font-size:10px!important;font-weight:700!important;box-shadow:none!important}.content:has(#ledgerBodyV13) .ledger-controls .input:focus,.content:has(#ledgerBodyV13) .ledger-controls select:focus{border-color:#45a48a!important;box-shadow:0 0 0 3px rgba(38,153,122,.08)!important}
          .content:has(#ledgerBodyV13) .ledger-summary-v13{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:9px!important;margin:0 0 9px!important}.content:has(#ledgerBodyV13) .ledger-summary-v13>div{min-height:56px!important;padding:8px 12px!important;border-radius:12px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:8px!important;border:1px solid #d8e5e0!important;box-shadow:0 7px 18px rgba(22,75,61,.04)!important;background:#fff!important}.content:has(#ledgerBodyV13) .ledger-summary-v13>div:nth-child(1){background:linear-gradient(135deg,#f1fbf7,#e9f8f1)!important;border-color:#cbe9dc!important}.content:has(#ledgerBodyV13) .ledger-summary-v13>div:nth-child(2){background:linear-gradient(135deg,#eef7ff,#e8f3fb)!important;border-color:#cfdfec!important}.content:has(#ledgerBodyV13) .ledger-summary-v13>div:nth-child(3){background:linear-gradient(135deg,#fff8ef,#fff0e0)!important;border-color:#f0dcc0!important}.content:has(#ledgerBodyV13) .ledger-summary-v13>div:nth-child(4){background:linear-gradient(135deg,#f5f1ff,#efeaff)!important;border-color:#ddd2f4!important}.content:has(#ledgerBodyV13) .ledger-summary-v13 small{font-size:9px!important;font-weight:800!important;color:#526e65!important;white-space:nowrap!important}.content:has(#ledgerBodyV13) .ledger-summary-v13 b{font-size:15px!important;line-height:1.1!important;color:#111d19!important;white-space:nowrap!important}
          .content:has(#ledgerBodyV13) .ledger-scroll-v13{height:min(390px,calc(100dvh - 315px))!important;max-height:min(390px,calc(100dvh - 315px))!important;min-height:220px!important;overflow:auto!important;scrollbar-gutter:auto!important;border:1.4px solid #4aa68c!important;border-radius:13px!important;background:#fff!important;box-shadow:0 8px 20px rgba(22,83,64,.035)!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13 table{width:100%!important;border-collapse:collapse!important;table-layout:fixed!important;font-size:9.5px!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13 thead th{position:sticky!important;top:0!important;z-index:3!important;height:40px!important;padding:6px 7px!important;background:linear-gradient(180deg,#0a715b,#075846)!important;color:#fff!important;border:1px solid rgba(0,0,0,.58)!important;text-align:center!important;font-weight:800!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13 td{height:38px!important;padding:6px 7px!important;border:1px solid rgba(0,0,0,.34)!important;text-align:center!important;background:#fff!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13 tbody tr[data-student]{cursor:pointer!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13 tbody tr:hover td{background:#d7ebe4!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13 .expense-total-v13{color:#b43d3d!important}
          @media(max-height:650px) and (min-width:1050px){.content:has(#ledgerBodyV13){padding-top:8px!important;padding-bottom:8px!important}.ledger-hero-v13{height:68px;margin-bottom:8px!important}.content:has(#ledgerBodyV13) .ledger-controls{padding-top:7px!important;padding-bottom:7px!important;margin-bottom:7px!important}.content:has(#ledgerBodyV13) .ledger-summary-v13{margin-bottom:7px!important}.content:has(#ledgerBodyV13) .ledger-summary-v13>div{min-height:50px!important}.content:has(#ledgerBodyV13) .ledger-scroll-v13{height:calc(100dvh - 280px)!important;max-height:calc(100dvh - 280px)!important;min-height:180px!important}}
          `;
          document.head.appendChild(ledgerRedesignStyle);
          '''
              css='\n'.join(line[10:] if line.startswith('          ') else line for line in css.splitlines())
              s=s.replace(marker,css+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/verify-critical-runtime.mjs')
          s=p.read_text(encoding='utf-8')
          anchor="requireText(financeUi,'scrollbar-gutter:auto!important','expense history only gives space to a scrollbar when it exists');"
          addition="\nrequireText(financeUi,'ledger-hero-v13','daily ledger uses the shared mint hero language');\nrequireText(financeUi,'height:min(390px,calc(100dvh - 315px))!important','daily ledger keeps a bounded internal-scroll transaction list');\nrequireText(financeUi,'efc-ledger-redesign-v13','daily ledger styling is consolidated in the finance source');\nforbidText(financeUi,\"pageTitle('الحركة اليومية','اليومية','اليوم المحدد فقط، وأحدث عملية في الأعلى.')\",'legacy daily ledger title notes');"
          if 'daily ledger uses the shared mint hero language' not in s:
              s=s.replace(anchor,anchor+addition,1)
          p.write_text(s,encoding='utf-8')

          old_token='20260913-list-scroll-2'
          new_token='20260913-ledger-redesign-1'
          for name in ['index.html','assets/production-license-gate-v8.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              if old_token not in s:
                  raise SystemExit(f'cache token missing in {name}')
              p.write_text(s.replace(old_token,new_token),encoding='utf-8')
          PY
      - name: Verify and build
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit ledger redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Redesign daily ledger workspace"
          git push origin HEAD:redesign/efc-ui-2026
