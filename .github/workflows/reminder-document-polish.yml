name: One-time reminder document polish

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - scripts/apply-reminder-document-polish.mjs
      - .github/workflows/reminder-document-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize patch-script template escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-reminder-document-polish.mjs')
          text = path.read_text(encoding='utf-8')
          path.write_text(text.replace('String.raw`', '`'), encoding='utf-8')
          PY

      - name: Apply canonical source changes
        run: node scripts/apply-reminder-document-polish.mjs

      - name: Preserve established reminder wording contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('assets/production-domain-v13.js')
          text = path.read_text(encoding='utf-8')
          text = text.replace('حتى يبقى ملفكم المالي محدثًا', 'لتحديث ملفكم المالي والمحافظة على انتظامه')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Verify production runtime
        run: npm run check

      - name: Build browser preview
        run: npm run build

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-receipts-v13.js assets/production-domain-v13.js assets/production-security-ui-v13.js scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          if git diff --cached --quiet; then
            echo "No reminder document changes to commit."
            exit 0
          fi
          git commit -m "Polish reminder documents and receipt headers"
          git push origin HEAD:redesign/efc-ui-2026
