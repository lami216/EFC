          p=Path(accounting); s=p.read_text(encoding='utf-8')
          s=s.replace("['syncCertificateFinanceSummaryGuard','certificate finance summary is neutralized for archived/mixed ranges'],","['syncCertificateFinanceSummaryGuard','certificate finance summary is neutralized for archived/mixed ranges'],\n  [\"document.getElementById('dayV13')\",'main finance guard follows the selected daily date'],")
          s=s.replace("requireText(index,'./assets/production-accounting-integrity-v21.js?v=20260916-accounting-integrity-v21-2'","requireText(index,'./assets/production-accounting-integrity-v21.js?v=20260916-finance-period-v22-1'")
          p.write_text(s,encoding='utf-8')

          gate='assets/production-license-gate-v8.js'
