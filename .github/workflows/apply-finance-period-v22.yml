          marker="const topbarPos=finance.indexOf('finance-topbar-v13');"
          if marker not in s: raise SystemExit('finance feedback insertion marker missing')
          s=s.replace(marker,insert+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')

