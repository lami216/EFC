name: Tune finance workspace size

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/finance-size-tune.yml

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enlarge finance workspace slightly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          finance=Path('assets/production-finance-ui-v13.js')
          text=finance.read_text(encoding='utf-8')
          old1='@media(max-height:760px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.88!important}}'
          new1='@media(max-height:760px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.92!important}}'
          old2='@media(max-height:650px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.78!important}}'
          new2='@media(max-height:650px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.86!important}}'
          if old1 not in text or old2 not in text:
              raise SystemExit('Finance responsive zoom rules not found')
          text=text.replace(old1,new1,1).replace(old2,new2,1)
          finance.write_text(text,encoding='utf-8')

          old='20260912-finance-redesign-1'
          new='20260912-finance-redesign-2'
          for filename in ['index.html','assets/production-license-gate-v8.js']:
              p=Path(filename)
              data=p.read_text(encoding='utf-8')
              if old not in data:
                  raise SystemExit(f'Cache token missing in {filename}')
              p.write_text(data.replace(old,new),encoding='utf-8')
          PY
      - name: Verify and build
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Enlarge finance workspace while keeping it compact"
          git push origin HEAD:redesign/efc-ui-2026
