name: Refine finance KPI and profitability details

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/finance-profit-details-maintenance.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply finance refinement
        run: python3 scripts/finance_profit_details_tmp.py
      - name: Verify and build
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js scripts/verify-critical-runtime.mjs scripts/verify-finance-feedback-v13.mjs index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Refine finance KPIs and move profitability details"
          git push origin HEAD:redesign/efc-ui-2026
