name: Refine settings redesign

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/settings-redesign-maintenance.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply settings redesign
        run: node scripts/apply-settings-redesign.mjs
      - name: Verify and build
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit settings redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-foundation-v13.js index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Redesign settings workspace"
          git push origin HEAD:redesign/efc-ui-2026
