name: Refine finance alignment and list scrolling

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/finance-scroll-policy-maintenance.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply finance and scroll refinements
        run: python3 scripts/finance_scroll_policy_tmp.py
      - name: Verify and build
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js assets/production-period-search-redesign-v28.js assets/production-student-search-redesign-v31.js assets/production-ui-v13.css scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Align finance KPIs and cap long result lists"
          git push origin HEAD:redesign/efc-ui-2026
