name: Run finance and expense receipt patch

on:
  push:
    branches:
      - feature/receipt-edit-hour-duration-v1
    paths:
      - '.github/workflows/run-finance-expense-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/receipt-edit-hour-duration-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Extract and apply integrated patch
        shell: pwsh
        run: |
          $verifyPath = 'scripts/verify-production-v13.mjs'
          $verify = [System.IO.File]::ReadAllText($verifyPath)
          $baseline = "'certificateFinanceByBranch:true','certificateFinanceByPaymentMethod:true','certificateIncomeExcludedFromMainFinance:true'"
          $expanded = "'certificateFinanceByBranch:true','certificateFinanceByPaymentMethod:true','certificateFinancePeriodAndLifetimeTotals:true','certificateFinanceSimplifiedUi:true','certificateIncomeExcludedFromMainFinance:true'"
          if (-not $verify.Contains("'certificateFinancePeriodAndLifetimeTotals:true'")) {
            if (-not $verify.Contains($baseline)) { throw 'Could not align certificate verifier baseline.' }
            $verify = $verify.Replace($baseline, $expanded)
            [System.IO.File]::WriteAllText($verifyPath, $verify, [System.Text.UTF8Encoding]::new($false))
          }

          $source = git show "3b0f814fde9f5d092b2bdd509c35f954c2fd2925:.github/workflows/patch-finance-expense-v1.yml"
          $lines = @($source -split "`n")
          $start = -1
          $end = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -eq '          from pathlib import Path') { $start = $i }
            if ($lines[$i] -eq "          print('Integrated finance/certificate/expense receipt patch applied successfully.')") { $end = $i; break }
          }
          if ($start -lt 0 -or $end -lt $start) { throw 'Could not extract the verified patch script from branch history.' }
          $script = @()
          for ($i = $start; $i -le $end; $i++) {
            $line = $lines[$i]
            if ($line.StartsWith('          ')) { $script += $line.Substring(10) } else { $script += $line }
          }
          $scriptText = [string]::Join("`n", $script)
          $scriptText = $scriptText.Replace('20260915-receipt-edit-hour-duration-4','__EFC_PREV_CACHE__')
          $scriptText = $scriptText.Replace('20260915-receipt-edit-hour-duration-5','20260915-receipt-edit-hour-duration-6')
          $scriptText = $scriptText.Replace('__EFC_PREV_CACHE__','20260915-receipt-edit-hour-duration-5')
          $scriptPath = Join-Path $env:RUNNER_TEMP 'efc-finance-expense-patch.py'
          [System.IO.File]::WriteAllText($scriptPath, $scriptText, [System.Text.UTF8Encoding]::new($false))
          python -m py_compile $scriptPath
          python $scriptPath

      - name: Install desktop build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate EFC app icons
        run: npm run icons

      - name: Verify production source
        run: npm run check

      - name: Verify HTML activation generator
        run: node scripts/verify-license-generator-html.mjs

      - name: Build frontend
        run: npm run build

      - name: Build legacy activation generator compatibility check
        run: cargo build --manifest-path tools/license-generator/Cargo.toml --release

      - name: Verify legacy activation generator compatibility output
        shell: pwsh
        run: |
          if (!(Test-Path "tools/license-generator/target/release/efc-license-generator.exe")) {
            throw "Legacy generator compatibility binary was not produced."
          }

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Smoke-test release startup
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike "*-setup.exe" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Release executable was not found." }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "Centre EFC exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force
          Write-Host "Centre EFC stayed alive during the startup smoke test."

      - name: Commit verified source changes
        shell: pwsh
        run: |
          git config user.name "lami216"
          git config user.email "iiyad21694@gmail.com"
          git add assets/production-finance-ui-v13.js assets/production-certificates-v13.js assets/production-license-gate-v8.js index.html scripts/verify-production-v13.mjs scripts/verify-registration-redesign-v15.mjs
          if (git diff --cached --quiet) { throw "No source changes were produced." }
          git commit -m "feat: align certificate finance and add expense receipts"
          git push origin HEAD:feature/receipt-edit-hour-duration-v1
