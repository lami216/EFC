          domain=replace_once(domain,'revisionStampedPayments:true,monthlyOpenLeadDays:OPEN_LEAD_DAYS','revisionStampedPayments:true,stoppedStudentHasEndDate:true,stoppedMonthlyPaidThroughProtected:true,monthlyOpenLeadDays:OPEN_LEAD_DAYS','stop markers')
