name: Apply finance visual redesign

on:
  push:
    branches: [redesign/efc-ui-2026]

permissions:
  contents: write

jobs:
  redesign:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply finance redesign
        run: python3 scripts/finance_redesign_tmp.py
      - name: Verify and build
        run: |
          npm ci
          npm run check
          npm run build
      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          git commit -m "Redesign finance workspace without changing behavior"
          git push origin HEAD:redesign/efc-ui-2026
