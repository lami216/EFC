name: Apply finance visual redesign

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/finance-redesign-maintenance.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Redesign finance page in place
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          finance_path=Path('assets/production-finance-ui-v13.js')
          text=finance_path.read_text(encoding='utf-8')

          old_title="pageTitle('الإدارة المالية','المالية','المداخيل والمصاريف والربحية حسب الفترة والفلاتر.')"
          new_title="`<section class=\"finance-hero-v13\"><svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><g fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19V9M10 19V5M16 19v-7M22 19H2M3.5 7.5 9 3l5 5 6-5\"/></g></svg><h1>المالية</h1></section>`"
          if old_title not in text:
              raise SystemExit('Finance title source pattern not found')
          text=text.replace(old_title,new_title,1)

          old_chart="const width=1120,height=330,left=105,right=30,top=30,bottom=52,values="
          new_chart="const width=1120,height=230,left=82,right=26,top=18,bottom=38,values="
          if old_chart not in text:
              raise SystemExit('Finance chart geometry pattern not found')
          text=text.replace(old_chart,new_chart,1)

          marker="@media(max-width:1250px){.finance-controls-v13{grid-template-columns:repeat(2,1fr)!important}}"
          if marker not in text:
              raise SystemExit('Finance style insertion marker not found')

          redesign=r'''
/* Finance visual redesign: same controls/content, new visual language only. */
.content:has(.finance-switch-v13){width:900px!important;max-width:900px!important;min-width:900px!important;margin:0 0 0 auto!important;padding:16px 0 18px!important;box-sizing:border-box!important;overflow:visible!important}
.finance-hero-v13{width:470px;height:76px;margin:0 auto 12px;border-radius:15px;background:linear-gradient(110deg,#dcf6ee 0%,#e8faf5 68%,#e4f7f2 100%);display:flex;align-items:center;justify-content:center;gap:20px;color:#073f35;box-shadow:0 9px 24px rgba(17,89,70,.045);position:relative}
.finance-hero-v13::after{content:"";position:absolute;bottom:10px;left:50%;width:48px;height:3px;border-radius:99px;background:#0b7b62;transform:translateX(-50%)}
.finance-hero-v13 svg{width:39px;height:39px;flex:0 0 39px}.finance-hero-v13 h1{margin:0;font-size:31px;line-height:1;font-weight:850;letter-spacing:-.4px}
.content:has(.finance-switch-v13) .finance-switch-v13{display:flex!important;justify-content:flex-start!important;direction:rtl!important;gap:7px!important;width:max-content!important;margin:0 0 9px auto!important;padding:0!important}
.content:has(.finance-switch-v13) .finance-switch-v13 button{height:39px!important;min-width:112px!important;padding:0 18px!important;border:1px solid #bed3cc!important;border-radius:9px!important;background:#fff!important;color:#183f35!important;font-family:inherit!important;font-size:12px!important;font-weight:760!important;box-shadow:0 4px 12px rgba(31,81,67,.035)!important;transition:transform .14s ease,box-shadow .14s ease,border-color .14s ease,background .14s ease!important}
.content:has(.finance-switch-v13) .finance-switch-v13 button:hover{transform:translateY(-1px)!important;border-color:#6da895!important;box-shadow:0 7px 16px rgba(31,81,67,.08)!important}
.content:has(.finance-switch-v13) .finance-switch-v13 button.active{background:linear-gradient(180deg,#0b775f,#08634f)!important;border-color:#08634f!important;color:#fff!important;box-shadow:0 7px 16px rgba(8,99,79,.15)!important}
.content:has(.finance-switch-v13) .finance-primary-action-row-v13{width:900px!important;margin:0 0 7px!important}.content:has(.finance-switch-v13) .finance-primary-action-row-v13 .button{height:38px!important;border-radius:9px!important;padding:0 15px!important;box-shadow:0 6px 14px rgba(8,99,79,.11)!important}
.content:has(.finance-switch-v13) .finance-controls-v13{width:900px!important;max-width:900px!important;min-width:900px!important;margin:0 0 10px!important;padding:11px 12px!important;gap:8px!important;align-items:end!important;border:1.4px solid #4aa68c!important;border-radius:13px!important;background:linear-gradient(135deg,rgba(239,251,247,.98),rgba(252,255,254,.99))!important;box-shadow:0 9px 25px rgba(22,83,64,.04)!important;grid-template-columns:218px repeat(4,minmax(0,1fr))!important}
.content:has(.finance-switch-v13) .finance-controls-v13 label{margin:0!important;gap:5px!important;color:#294d43!important;font-size:9px!important;font-weight:760!important}.content:has(.finance-switch-v13) .finance-controls-v13 select{height:41px!important;min-width:0!important;border:1px solid #cfddd8!important;border-radius:8px!important;background:#fff!important;color:#162721!important;font-family:inherit!important;font-size:11.5px!important;padding:7px 10px!important;box-shadow:none!important}.content:has(.finance-switch-v13) .finance-controls-v13 select:focus{border-color:#1b8c70!important;box-shadow:0 0 0 3px rgba(27,140,112,.09)!important;outline:none!important}
.content:has(.finance-switch-v13) #financeModeV13{height:41px!important;display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:4px!important;padding:4px!important;border:1px solid #c9ddd6!important;border-radius:11px!important;background:#e9f4f0!important;box-shadow:inset 0 1px 0 #ffffffb8!important}
.content:has(.finance-switch-v13) #financeModeV13 button{height:31px!important;min-width:0!important;border:1px solid transparent!important;border-radius:8px!important;background:transparent!important;color:#58746b!important;font-family:inherit!important;font-size:10.5px!important;font-weight:780!important;cursor:pointer!important;transition:all .14s ease!important;position:relative!important;overflow:hidden!important}
.content:has(.finance-switch-v13) #financeModeV13 button[data-mode="daily"]{background:linear-gradient(180deg,#f6fbff,#eef8fb)!important}.content:has(.finance-switch-v13) #financeModeV13 button[data-mode="monthly"]{background:linear-gradient(180deg,#f1fbf7,#e7f6ef)!important}.content:has(.finance-switch-v13) #financeModeV13 button[data-mode="yearly"]{background:linear-gradient(180deg,#fffaf0,#fbf3e5)!important}
.content:has(.finance-switch-v13) #financeModeV13 button:hover{transform:translateY(-1px)!important;color:#0b6853!important;box-shadow:0 3px 8px rgba(32,85,69,.08)!important}.content:has(.finance-switch-v13) #financeModeV13 button.active{background:linear-gradient(180deg,#0b7b62,#08624f)!important;border-color:#08624f!important;color:#fff!important;box-shadow:0 5px 12px rgba(8,98,79,.16)!important;transform:none!important}
.content:has(.finance-switch-v13) #financeBodyV13>.kpis{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:9px!important;margin:0 0 10px!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis>.card{min-height:76px!important;margin:0!important;padding:12px 14px!important;border:1px solid #d8e5e0!important;border-radius:12px!important;box-shadow:0 7px 18px rgba(22,75,61,.04)!important;display:flex!important;flex-direction:column!important;justify-content:center!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis>.card:nth-child(1){background:linear-gradient(135deg,#f1fbf7,#e9f8f1)!important;border-color:#cbe9dc!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis>.card:nth-child(2){background:linear-gradient(135deg,#f5f1ff,#f0ebff)!important;border-color:#ded3f6!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis>.card:nth-child(3){background:linear-gradient(135deg,#fff9ee,#fff3df)!important;border-color:#f0dfba!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis>.card:nth-child(4){background:linear-gradient(135deg,#eef7ff,#e8f3fb)!important;border-color:#cfdfec!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis small{font-size:8.8px!important;color:#657b74!important;margin-bottom:4px!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis b{font-size:18px!important;line-height:1.2!important;color:#111d19!important}.content:has(.finance-switch-v13) #financeBodyV13>.kpis span{font-size:8px!important;color:#7b8d87!important;margin-top:3px!important}
.content:has(.finance-switch-v13) #financeBodyV13>.chart-card{width:900px!important;margin:0 0 10px!important;padding:7px 10px 4px!important;border:1px solid #d8e5e0!important;border-radius:13px!important;background:#fff!important;box-shadow:0 8px 20px rgba(22,75,61,.035)!important}.content:has(.finance-switch-v13) #financeBodyV13>.chart-card>h3{margin:3px 6px 0!important;font-size:11px!important}.content:has(.finance-switch-v13) .finance-chart-wrap-v13{width:100%!important;overflow:hidden!important}.content:has(.finance-switch-v13) .finance-chart-wrap-v13 svg{display:block!important;width:100%!important;height:auto!important;max-height:205px!important}.content:has(.finance-switch-v13) .finance-gridline-v13{stroke:#dbe6e2!important}.content:has(.finance-switch-v13) .finance-line-v13{stroke:#08745b!important;stroke-width:3!important}.content:has(.finance-switch-v13) .finance-dot-v13{stroke:#08745b!important;fill:#fff!important}
.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:10px!important;margin:0!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card{min-height:112px!important;margin:0!important;padding:11px 13px!important;border-radius:12px!important;box-shadow:0 7px 18px rgba(22,75,61,.035)!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card:nth-child(1){background:linear-gradient(135deg,#eef9fb,#e8f5f2)!important;border:1px solid #b9ddd5!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card:nth-child(2){background:linear-gradient(135deg,#fff9ed,#fff3df)!important;border:1px solid #ecdcb7!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card:nth-child(3){background:linear-gradient(135deg,#eef5ff,#e8f1fb)!important;border:1px solid #cadced!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns h3{margin:0 0 8px!important;font-size:11.5px!important;color:#173d34!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card:nth-child(1) h3{color:#0a6b59!important}.content:has(.finance-switch-v13) .break-row{grid-template-columns:minmax(0,1fr) auto!important;gap:3px 9px!important;margin:0 0 6px!important;font-size:8.7px!important}.content:has(.finance-switch-v13) .break-row>div{grid-column:1/-1!important;height:4px!important;border-radius:99px!important;background:#dfe8e4!important;overflow:hidden!important}.content:has(.finance-switch-v13) .break-row>div>i{height:100%!important;border-radius:99px!important;background:#159577!important}.content:has(.finance-switch-v13) #financeBodyV13>.breakdowns>.card:nth-child(1) .expense-bar-v13{background:#319d88!important}
.content:has(.finance-switch-v13) .expense-list-v13,.content:has(.finance-switch-v13) .profitability-explorer-v13{margin-top:10px!important;padding:10px!important;border:1.4px solid #63a993!important;border-radius:12px!important;background:#fff!important;box-shadow:0 8px 20px rgba(22,75,61,.035)!important}.content:has(.finance-switch-v13) .expense-list-v13{max-height:170px!important;overflow:auto!important}.content:has(.finance-switch-v13) .profitability-mode-v13{margin-bottom:8px!important}.content:has(.finance-switch-v13) .profitability-mode-v13 button{height:34px!important;padding:0 13px!important;border-radius:8px!important;font-size:9px!important}.content:has(.finance-switch-v13) #financeBodyV13 .table-wrap{border:1px solid rgba(0,0,0,.4)!important;border-radius:9px!important;overflow:auto!important}.content:has(.finance-switch-v13) #financeBodyV13 table{font-size:9px!important}.content:has(.finance-switch-v13) #financeBodyV13 th{height:35px!important;padding:6px 7px!important;background:linear-gradient(180deg,#0a715b,#075846)!important;color:#fff!important;border:1px solid rgba(0,0,0,.45)!important}.content:has(.finance-switch-v13) #financeBodyV13 td{height:32px!important;padding:5px 7px!important}
@media(max-height:760px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.88!important}}
@media(max-height:650px) and (min-width:1050px){.content:has(.finance-switch-v13){zoom:.78!important}}
'''
          text=text.replace(marker,redesign+'\n'+marker,1)
          finance_path.write_text(text,encoding='utf-8')

          verifier=Path('scripts/verify-critical-runtime.mjs')
          verify_text=verifier.read_text(encoding='utf-8')
          anchor="const securityUi=read('assets/production-security-ui-v13.js');"
          check="""const financeUi=read('assets/production-finance-ui-v13.js');\nrequireText(financeUi,'finance-hero-v13','finance page uses the shared mint hero language');\nrequireText(financeUi,'height=230','finance chart is compact enough for the fixed workspace');\nrequireText(financeUi,'#financeModeV13 button.active','finance period buttons have an explicit active visual state');\nforbidText(financeUi,\"pageTitle('الإدارة المالية','المالية','المداخيل والمصاريف والربحية حسب الفترة والفلاتر.')\",'legacy finance title notes');\n\n"""
          if check not in verify_text:
              if anchor not in verify_text: raise SystemExit('Verifier insertion anchor not found')
              verify_text=verify_text.replace(anchor,check+anchor,1)
              verifier.write_text(verify_text,encoding='utf-8')

          old_version='20260912-reminder-clean-3'
          new_version='20260912-finance-redesign-1'
          for filename in ['index.html','assets/production-license-gate-v8.js']:
              path=Path(filename); data=path.read_text(encoding='utf-8')
              if old_version not in data:
                  raise SystemExit(f'Cache token not found in {filename}')
              path.write_text(data.replace(old_version,new_version),encoding='utf-8')
          PY

          npm ci
          npm run check
          npm run build

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          git commit -m "Redesign finance workspace without changing behavior"
          git push origin HEAD:redesign/efc-ui-2026
