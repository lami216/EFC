name: Archive and clean obsolete EFC branches (one time)

on:
  push:
    branches:
      - feature/efc-next-development
    paths:
      - .github/workflows/efc-branch-cleanup-one-time.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  archive-and-clean:
    if: github.repository == 'lami216/EFC'
    runs-on: ubuntu-latest
    steps:
      - name: Archive obsolete branches as Git tags before pruning
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner='lami216',repo='EFC';
            const expectedMain='3dbf4c2f4363ab60cd91107385059e7e65bf5a33';
            const actualMain=(await github.rest.repos.getBranch({owner,repo,branch:'main'})).data.commit.sha;
            if(actualMain!==expectedMain)throw new Error('main changed since review; refusing branch cleanup');
            const preserve=new Set([
              'main','feature/efc-next-development',
              'feature/certificate-external-branch-delete-v1',
              'fix/accounting-integrity-v21',
              'fix/student-lifecycle-numbering-v20',
              'feature/certificate-manager-receipt-bank-v22',
              'redesign/efc-ui-2026'
            ]);
            const pulls=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            for(const pr of pulls){
              if(pr.head.repo?.full_name===owner+'/'+repo)preserve.add(pr.head.ref);
              if(pr.base.repo?.full_name===owner+'/'+repo)preserve.add(pr.base.ref);
            }
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const removable=branches.filter(item=>!preserve.has(item.name)&&!item.protected);
            console.log('Branches:',branches.length,'preserved:',[...preserve],'candidates:',removable.length);
            if(branches.length>100||removable.length>60)throw new Error('Unexpected branch list; refusing cleanup');
            const archived=[];
            // Phase 1: make every old branch recoverable before deleting ANY ref.
            for(const item of removable){
              const tag='efc-archive-2026-11-01/'+item.name;
              const ref='tags/'+tag;
              try{
                await github.rest.git.createRef({owner,repo,ref:'refs/'+ref,sha:item.commit.sha});
              }catch(error){
                if(error.status!==422)throw error;
                const existing=(await github.rest.git.getRef({owner,repo,ref})).data;
                if(existing.object.sha!==item.commit.sha)throw new Error('Conflicting archive for '+item.name);
              }
              const confirmed=(await github.rest.git.getRef({owner,repo,ref})).data;
              if(confirmed.object.sha!==item.commit.sha)throw new Error('Archive mismatch for '+item.name);
              archived.push(item);
              await new Promise(resolve=>setTimeout(resolve,350));
            }
            if(archived.length!==removable.length)throw new Error('Incomplete archival: nothing deleted');
            console.log('All '+archived.length+' candidate branch heads archived as Git tags.');
            // Phase 2: delete only unchanged, unprotected, non-PR branches.
            let deleted=0;const skipped=[];
            for(const item of archived){
              try{
                const original=(await github.rest.git.getRef({owner,repo,ref:'heads/'+item.name})).data;
                if(original.object.sha!==item.commit.sha){skipped.push(item.name+': updated during cleanup');continue;}
                await github.rest.git.deleteRef({owner,repo,ref:'heads/'+item.name});
                deleted++;
              }catch(error){skipped.push(item.name+': '+(error.message||error.status));}
              await new Promise(resolve=>setTimeout(resolve,500));
            }
            console.log('Deleted:',deleted,'Skipped:',skipped.length,skipped);
            core.summary.addHeading('EFC Branch Cleanup')
              .addRaw('Archived '+archived.length+' branch heads as Git tags. Deleted '+deleted+
                ' obsolete branches. Preserved '+[...preserve].join(', ')+'. Skipped '+skipped.join('; '))
              .write();
