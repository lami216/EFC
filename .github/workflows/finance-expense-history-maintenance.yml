name: Refine finance expenses and charts

on:
  push:
    branches:
      - redesign/efc-ui-2026
    paths:
      - .github/workflows/finance-expense-history-maintenance.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/efc-ui-2026
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply finance refinement
        run: python3 scripts/finance_expense_history_tmp.py
      - name: Refresh finance chart verifier expectation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/verify-critical-runtime.mjs')
          s=p.read_text(encoding='utf-8')
          old="requireText(financeUi,'height=205','finance chart is compact enough for the fixed workspace');"
          new="requireText(financeUi,'height=235','finance chart keeps a larger readable workspace');"
          if old not in s:
              raise SystemExit('old finance chart verifier token not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify and build
        run: |
          npm install --ignore-scripts
          npm run check
          npm run build
      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/production-finance-ui-v13.js scripts/verify-critical-runtime.mjs index.html assets/production-license-gate-v8.js
          git diff --cached --quiet && exit 0
          git commit -m "Move expense history out of finance dashboard"
          git push origin HEAD:redesign/efc-ui-2026
