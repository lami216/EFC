name: Verify fiscal current v14

on:
  push:
    branches:
      - feature/fiscal-year-current-v14
    paths:
      - '.github/workflows/fiscal-current-v14-verify.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    steps:
      - name: Checkout fiscal branch
        uses: actions/checkout@v4
        with:
          ref: feature/fiscal-year-current-v14
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Harden fiscal restore and cleanup identities
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if new in text: return
              if old not in text: raise RuntimeError(f'{label}: expected pattern not found in {path}')
              p.write_text(text.replace(old,new,1),encoding='utf-8',newline='\n')

          fiscal='assets/production-fiscal-year-v14.js'
          replace_once(fiscal,
            "    studentRecordCodes:Array.isArray(source.studentRecordCodes)?source.studentRecordCodes.map(String).filter(Boolean):[],\n    expenseIds:Array.isArray(source.expenseIds)?source.expenseIds.map(String).filter(Boolean):[],\n    certificateRecordCodes:Array.isArray(source.certificateRecordCodes)?source.certificateRecordCodes.map(String).filter(Boolean):[],",
            "    studentIds:Array.isArray(source.studentIds)?source.studentIds.map(String).filter(Boolean):[],\n    studentRecordCodes:Array.isArray(source.studentRecordCodes)?source.studentRecordCodes.map(String).filter(Boolean):[],\n    expenseIds:Array.isArray(source.expenseIds)?source.expenseIds.map(String).filter(Boolean):[],\n    certificateIds:Array.isArray(source.certificateIds)?source.certificateIds.map(String).filter(Boolean):[],\n    certificateRecordCodes:Array.isArray(source.certificateRecordCodes)?source.certificateRecordCodes.map(String).filter(Boolean):[],",
            'normalize cleanup legacy ids')
          replace_once(fiscal,
            "  return normalizeCleanup({studentRecordCodes:studentRows.map(student=>String(student.recordCode||student.id)).filter(Boolean),expenseIds:expenses.map(row=>String(row.id)).filter(Boolean),certificateRecordCodes:certificates.map(row=>String(row.recordCode||'')).filter(Boolean),certificateTransactionCodes:certificates.map(row=>String(row.transactionCode||'')).filter(Boolean)});",
            "  return normalizeCleanup({studentIds:studentRows.map(student=>String(student.id||'')).filter(Boolean),studentRecordCodes:studentRows.map(student=>String(student.recordCode||'')).filter(Boolean),expenseIds:expenses.map(row=>String(row.id)).filter(Boolean),certificateIds:certificates.map(row=>String(row.id||'')).filter(Boolean),certificateRecordCodes:certificates.map(row=>String(row.recordCode||'')).filter(Boolean),certificateTransactionCodes:certificates.map(row=>String(row.transactionCode||'')).filter(Boolean)});",
            'cleanup plan identities')
          replace_once(fiscal,
            "  const studentRecordCodes=new Set(),expenseIds=new Set(),certificateRecordCodes=new Set(),certificateTransactionCodes=new Set();\n  const add=cleanup=>{const value=normalizeCleanup(cleanup);value.studentRecordCodes.forEach(x=>studentRecordCodes.add(x));value.expenseIds.forEach(x=>expenseIds.add(x));value.certificateRecordCodes.forEach(x=>certificateRecordCodes.add(x));value.certificateTransactionCodes.forEach(x=>certificateTransactionCodes.add(x));};\n  fromState.archives.forEach(item=>add(item.cleanup));if(fromState.pendingClose)add(fromState.pendingClose.cleanupPlan);\n  return{studentRecordCodes,expenseIds,certificateRecordCodes,certificateTransactionCodes};",
            "  const studentIds=new Set(),studentRecordCodes=new Set(),expenseIds=new Set(),certificateIds=new Set(),certificateRecordCodes=new Set(),certificateTransactionCodes=new Set();\n  const add=cleanup=>{const value=normalizeCleanup(cleanup);value.studentIds.forEach(x=>studentIds.add(x));value.studentRecordCodes.forEach(x=>studentRecordCodes.add(x));value.expenseIds.forEach(x=>expenseIds.add(x));value.certificateIds.forEach(x=>certificateIds.add(x));value.certificateRecordCodes.forEach(x=>certificateRecordCodes.add(x));value.certificateTransactionCodes.forEach(x=>certificateTransactionCodes.add(x));};\n  fromState.archives.forEach(item=>add(item.cleanup));if(fromState.pendingClose)add(fromState.pendingClose.cleanupPlan);\n  return{studentIds,studentRecordCodes,expenseIds,certificateIds,certificateRecordCodes,certificateTransactionCodes};",
            'tombstone identities')
          replace_once(fiscal,
            "  const cleanup=normalizeCleanup(pending.cleanupPlan),periodEnd=pending.archive.periodEnd,studentCodes=new Set(cleanup.studentRecordCodes);",
            "  const cleanup=normalizeCleanup(pending.cleanupPlan),periodEnd=pending.archive.periodEnd,studentIds=new Set(cleanup.studentIds),studentCodes=new Set(cleanup.studentRecordCodes);",
            'cleanup student ids')
          replace_once(fiscal,
            "    const code=String(student.recordCode||student.id||'');if(!studentCodes.has(code))return true;",
            "    const id=String(student.id||''),code=String(student.recordCode||'');if(!studentIds.has(id)&&!studentCodes.has(code))return true;",
            'cleanup student identity match')
          replace_once(fiscal,
            "  const certResult=await certificateApi()?.purgeReceiptsByCodes?.(cleanup.certificateRecordCodes,cleanup.certificateTransactionCodes),certificatesDeleted=Math.max(0,Number(certResult?.deleted||0));",
            "  const certResult=await certificateApi()?.purgeReceiptsByIdentity?.({ids:cleanup.certificateIds,recordCodes:cleanup.certificateRecordCodes,transactionCodes:cleanup.certificateTransactionCodes}),certificatesDeleted=Math.max(0,Number(certResult?.deleted||0));",
            'certificate cleanup identity api')
          replace_once(fiscal,
            "  const current=normalizeState(currentRaw),incoming=normalizeState(incomingRaw);if(!incoming.config)return current;if(!current.config)return incoming;if(incoming.config.anchorDate!==current.config.anchorDate)return current;",
            "  const current=normalizeState(currentRaw),incoming=normalizeState(incomingRaw);if(!incoming.config)return current;if(!current.config)return incoming;if(incoming.config.anchorDate!==current.config.anchorDate)throw new Error('النسخة الاحتياطية تستخدم بداية سنة مالية مختلفة عن النظام الحالي. لا يمكن دمج أرشيفين ماليين بحدود مختلفة.');",
            'reject fiscal anchor mismatch')
          replace_once(fiscal,
            "  if(Array.isArray(source.students))source.students=source.students.filter(student=>!dead.studentRecordCodes.has(String(student?.recordCode||student?.id||'')));",
            "  if(Array.isArray(source.students))source.students=source.students.filter(student=>!dead.studentIds.has(String(student?.id||''))&&!dead.studentRecordCodes.has(String(student?.recordCode||'')));",
            'filter restored student legacy id')
          replace_once(fiscal,
            "  if(Array.isArray(source.certificateReceipts))source.certificateReceipts=source.certificateReceipts.filter(row=>!dead.certificateRecordCodes.has(String(row?.recordCode||''))&&!dead.certificateTransactionCodes.has(String(row?.transactionCode||'')));",
            "  if(Array.isArray(source.certificateReceipts))source.certificateReceipts=source.certificateReceipts.filter(row=>!dead.certificateIds.has(String(row?.id||''))&&!dead.certificateRecordCodes.has(String(row?.recordCode||''))&&!dead.certificateTransactionCodes.has(String(row?.transactionCode||'')));",
            'filter restored certificate legacy id')
          replace_once(fiscal,
            "  const keptStudents=students.filter(student=>!dead.studentRecordCodes.has(String(student?.recordCode||student?.id||'')));if(keptStudents.length!==students.length){students.splice(0,students.length,...keptStudents);D.saveStudents();changed=true;}",
            "  const keptStudents=students.filter(student=>!dead.studentIds.has(String(student?.id||''))&&!dead.studentRecordCodes.has(String(student?.recordCode||'')));if(keptStudents.length!==students.length){students.splice(0,students.length,...keptStudents);D.saveStudents();changed=true;}",
            'sanitize students by stable and legacy id')
          replace_once(fiscal,
            "  const certResult=await certificateApi()?.purgeReceiptsByCodes?.([...dead.certificateRecordCodes],[...dead.certificateTransactionCodes]);if(Number(certResult?.deleted||0)>0)changed=true;",
            "  const certResult=await certificateApi()?.purgeReceiptsByIdentity?.({ids:[...dead.certificateIds],recordCodes:[...dead.certificateRecordCodes],transactionCodes:[...dead.certificateTransactionCodes]});if(Number(certResult?.deleted||0)>0)changed=true;",
            'sanitize certificates by identities')

          cert='assets/production-certificates-v13.js'
          replace_once(cert,
            "window.EFC_CERTIFICATE_STATE_V14=Object.freeze({snapshot:()=>JSON.parse(JSON.stringify(state)),purgeReceiptsByCodes:async(recordCodes=[],transactionCodes=[])=>{const records=new Set((recordCodes||[]).map(String)),transactions=new Set((transactionCodes||[]).map(String)),before=state.certificateReceipts.length;state={...state,certificateReceipts:state.certificateReceipts.filter(item=>!records.has(String(item.recordCode||''))&&!transactions.has(String(item.transactionCode||'')))};const deleted=before-state.certificateReceipts.length;if(deleted)await persist();return{deleted};}});",
            "window.EFC_CERTIFICATE_STATE_V14=Object.freeze({snapshot:()=>JSON.parse(JSON.stringify(state)),purgeReceiptsByIdentity:async({ids=[],recordCodes=[],transactionCodes=[]}={})=>{const idSet=new Set((ids||[]).map(String)),records=new Set((recordCodes||[]).map(String)),transactions=new Set((transactionCodes||[]).map(String)),before=state.certificateReceipts.length;state={...state,certificateReceipts:state.certificateReceipts.filter(item=>!idSet.has(String(item.id||''))&&!records.has(String(item.recordCode||''))&&!transactions.has(String(item.transactionCode||'')))};const deleted=before-state.certificateReceipts.length;if(deleted)await persist();return{deleted};}});",
            'certificate identity purge api')

          verify='scripts/verify-fiscal-current-v14.mjs'
          replace_once(verify,
            "context.window.EFC_CERTIFICATE_STATE_V14={snapshot:()=>structuredClone(certificateState),purgeReceiptsByCodes:async(recordCodes=[],transactionCodes=[])=>{const records=new Set(recordCodes.map(String)),transactions=new Set(transactionCodes.map(String)),before=certificateState.certificateReceipts.length;certificateState={...certificateState,certificateReceipts:certificateState.certificateReceipts.filter(row=>!records.has(String(row.recordCode||''))&&!transactions.has(String(row.transactionCode||'')))};return{deleted:before-certificateState.certificateReceipts.length};}};",
            "context.window.EFC_CERTIFICATE_STATE_V14={snapshot:()=>structuredClone(certificateState),purgeReceiptsByIdentity:async({ids=[],recordCodes=[],transactionCodes=[]}={})=>{const idSet=new Set(ids.map(String)),records=new Set(recordCodes.map(String)),transactions=new Set(transactionCodes.map(String)),before=certificateState.certificateReceipts.length;certificateState={...certificateState,certificateReceipts:certificateState.certificateReceipts.filter(row=>!idSet.has(String(row.id||''))&&!records.has(String(row.recordCode||''))&&!transactions.has(String(row.transactionCode||'')))};return{deleted:before-certificateState.certificateReceipts.length};}};",
            'verifier certificate identity api')
          replace_once(verify,
            "assert.equal(first.cleanup.studentRecordCodes.includes('reg-ended'),true);\nassert.equal(first.cleanup.expenseIds.includes('e-old'),true);\nassert.equal(first.cleanup.certificateRecordCodes.includes('cr-old'),true);",
            "assert.equal(first.cleanup.studentIds.includes('ended-settled'),true);\nassert.equal(first.cleanup.studentRecordCodes.includes('reg-ended'),true);\nassert.equal(first.cleanup.expenseIds.includes('e-old'),true);\nassert.equal(first.cleanup.certificateIds.includes('cert-old'),true);\nassert.equal(first.cleanup.certificateRecordCodes.includes('cr-old'),true);",
            'verifier tombstone identities')
          replace_once(verify,
            "const imported={students:[{id:'old',recordCode:'reg-ended',payments:[]}],expenses:[{id:'e-old',amount:100}],certificateReceipts:[{recordCode:'cr-old',transactionCode:'ctx-old'}],specialties:[],paymentMethods:[],fiscalState:F.getState()};",
            "const imported={students:[{id:'ended-settled',payments:[]}],expenses:[{id:'e-old',amount:100}],certificateReceipts:[{id:'cert-old'}],specialties:[],paymentMethods:[],fiscalState:F.getState()};",
            'verifier legacy restore identities')
          replace_once(verify,
            "assert.equal(appliedIncoming.certificateReceipts.length,0,'closed certificate tombstone must filter restored backup');\n\nsaved=F.getState();",
            "assert.equal(appliedIncoming.certificateReceipts.length,0,'closed certificate tombstone must filter restored backup');\nconst mismatch=structuredClone(F.getState());mismatch.config.anchorDate='2025-10-01';mismatch.config.firstEndDate='2026-09-30';\nawait assert.rejects(context.window.EFC_APPLY_RESTORED_STATE({students:[],specialties:[],paymentMethods:[],fiscalState:mismatch}),/بداية سنة مالية مختلفة/,'different fiscal anchors must never be silently merged');\n\nsaved=F.getState();",
            'verifier anchor mismatch rejection')

          prod='scripts/verify-production-v13.mjs'
          p=Path(prod); text=p.read_text(encoding='utf-8')
          text=text.replace("'window.EFC_CERTIFICATE_STATE_V14','certificateManagementTitleBelowHeader:true'","'window.EFC_CERTIFICATE_STATE_V14','purgeReceiptsByIdentity','certificateManagementTitleBelowHeader:true'")
          text=text.replace("'tombstoneRestoreProtection:true','pendingCloseJournal:true'","'tombstoneRestoreProtection:true','pendingCloseJournal:true'")
          p.write_text(text,encoding='utf-8',newline='\n')

          for path in [Path('index.html'),Path('assets/production-license-gate-v8.js'),*Path('scripts').glob('*.mjs')]:
              text=path.read_text(encoding='utf-8')
              if '20260916-fiscal-year-current-v14-1' in text:
                  path.write_text(text.replace('20260916-fiscal-year-current-v14-1','20260916-fiscal-year-current-v14-2'),encoding='utf-8',newline='\n')

          print('Fiscal restore identities and anchor compatibility hardened.')
          '@ | Set-Content -Path "$env:RUNNER_TEMP\harden-fiscal-v14.py" -Encoding utf8
          python "$env:RUNNER_TEMP\harden-fiscal-v14.py"

      - name: Install desktop build tools
        run: npm install --no-audit --no-fund --package-lock=false

      - name: Generate EFC app icons
        run: npm run icons

      - name: Verify production source
        run: npm run check

      - name: Verify HTML activation generator
        run: node scripts/verify-license-generator-html.mjs

      - name: Build frontend
        run: npm run build

      - name: Build legacy activation generator compatibility check
        run: cargo build --manifest-path tools/license-generator/Cargo.toml --release

      - name: Verify legacy activation generator compatibility output
        shell: pwsh
        run: |
          if (!(Test-Path "tools/license-generator/target/release/efc-license-generator.exe")) {
            throw "Legacy generator compatibility binary was not produced."
          }

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis

      - name: Smoke-test release startup
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/*.exe" |
            Where-Object { $_.Name -notlike "*-setup.exe" } |
            Sort-Object Length -Descending |
            Select-Object -First 1
          if (-not $exe) { throw "Release executable was not found." }
          $process = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Centre EFC exited during startup smoke test with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Commit verified hardening
        shell: pwsh
        run: |
          git config user.name "lami216"
          git config user.email "iiyad21694@gmail.com"
          git add assets/production-fiscal-year-v14.js assets/production-certificates-v13.js scripts/verify-fiscal-current-v14.mjs scripts/verify-production-v13.mjs index.html assets/production-license-gate-v8.js
          if (git diff --cached --quiet) { throw "No fiscal hardening changes were produced." }
          git commit -m "fix: harden fiscal close and restore boundaries"
          git push origin HEAD:feature/fiscal-year-current-v14
